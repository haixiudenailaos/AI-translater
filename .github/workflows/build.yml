name: Build V1.6

on:
  push:
    branches: [V1.6]
    tags:
      - 'v*'
      - 'V*'
  pull_request:
    branches: [V1.6]
  workflow_dispatch:

env:
  APP_NAME: LightNovelTranslator
  APP_VERSION: "1.6"
  PYTHON_VERSION: "3.11"

jobs:
  # P1-6：质量门禁——PR 必须先通过 lint、format check 和测试
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r requirements.txt

      - name: Ruff lint
        run: python -m ruff check main.py build.py src tests tools

      - name: Ruff format check
        run: python -m ruff format --check main.py build.py src tests tools

      - name: Run tests
        run: python -m pytest -q

  # P0-1：Text Edition 和 Full Edition 使用独立 matrix
  build-windows:
    needs: quality
    strategy:
      matrix:
        edition:
          - { spec: translator_text.spec, name: Text, binary: LightNovelTranslatorV1.6-Text }
          - { spec: translator.spec, name: Full, binary: LightNovelTranslatorV1.6 }
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Windows executable (onedir)
        shell: pwsh
        run: pyinstaller ${{ matrix.edition.spec }} --clean --noconfirm

      - name: Validate and package onedir output
        shell: pwsh
        run: |
          # P0-1：onedir 产物位于 dist/<binary_name>/<binary_name>.exe
          $onedir = "dist/${{ matrix.edition.binary }}"
          $exe = Join-Path $onedir "${{ matrix.edition.binary }}.exe"
          if (-not (Test-Path $exe)) {
            throw "PyInstaller onedir executable not found at: $exe"
          }
          Write-Host "Found executable: $exe ($([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB)"

          # 打包整个 onedir 目录为 zip
          $zipName = "${{ env.APP_NAME }}-${{ env.APP_VERSION }}-Windows-x64-${{ matrix.edition.name }}.zip"
          Compress-Archive -Path "$onedir/*" -DestinationPath "dist/$zipName" -Force
          Write-Host "Created zip: dist/$zipName"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-Windows-x64-${{ matrix.edition.name }}
          path: dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-Windows-x64-${{ matrix.edition.name }}.zip
          retention-days: 30

  build-macos:
    needs: quality
    strategy:
      matrix:
        edition:
          - { spec: translator_text.spec, name: Text, binary: LightNovelTranslatorV1.6-Text }
          - { spec: translator.spec, name: Full, binary: LightNovelTranslatorV1.6 }
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build macOS executable (onedir)
        run: pyinstaller ${{ matrix.edition.spec }} --clean --noconfirm

      - name: Assemble macOS application bundle
        shell: bash
        run: |
          # P0-1：onedir 产物位于 dist/<binary_name>/<binary_name>
          ONEDIR="dist/${{ matrix.edition.binary }}"
          BINARY="$ONEDIR/${{ matrix.edition.binary }}"
          if [ ! -f "$BINARY" ]; then
            echo "ERROR: PyInstaller onedir binary not found at: $BINARY"
            ls -la dist/ || true
            ls -la "$ONEDIR" 2>/dev/null || true
            exit 1
          fi

          APP_DIR="dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-macOS-${{ matrix.edition.name }}.app"
          APP_BINARY="$APP_DIR/Contents/MacOS/${{ env.APP_NAME }}"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"

          # P0-1：复制整个 onedir 目录内容（主二进制 + _internal 依赖）
          cp -R "$ONEDIR/"* "$APP_DIR/Contents/MacOS/"
          chmod +x "$APP_DIR/Contents/MacOS/${{ env.APP_NAME }}"
          chmod +x "$APP_BINARY" 2>/dev/null || true

          cat > "$APP_DIR/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>LightNovelTranslator</string>
            <key>CFBundleExecutable</key>
            <string>LightNovelTranslator</string>
            <key>CFBundleIdentifier</key>
            <string>com.haixiudenailaos.lightnoveltranslator</string>
            <key>CFBundleName</key>
            <string>LightNovelTranslator</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.6</string>
            <key>CFBundleVersion</key>
            <string>1.6</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP_DIR/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "${APP_DIR}.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-macOS-${{ matrix.edition.name }}
          path: dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-macOS-${{ matrix.edition.name }}.app.zip
          retention-days: 30

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/V1.6' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: LightNovelTranslator V1.6
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'V1.6' }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
