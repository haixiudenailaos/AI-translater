name: Build V1.6

on:
  push:
    branches: [V1.6]
  pull_request:
    branches: [V1.6]
  create:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

env:
  APP_NAME: LightNovelTranslator
  APP_VERSION: "1.6"
  PYTHON_VERSION: "3.11"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Windows executable
        shell: pwsh
        run: pyinstaller translator.spec --clean --noconfirm

      - name: Rename and validate executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "PyInstaller did not produce a Windows executable" }
          $target = "${{ env.APP_NAME }}-${{ env.APP_VERSION }}-Windows-x64.exe"
          Move-Item -LiteralPath $exe.FullName -Destination (Join-Path dist $target)

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-Windows-x64
          path: dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-Windows-x64.exe
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build macOS executable
        run: pyinstaller translator.spec --clean --noconfirm

      - name: Assemble macOS application bundle
        shell: bash
        run: |
          APP_DIR="dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-macOS-Universal.app"
          APP_BINARY="$APP_DIR/Contents/MacOS/${{ env.APP_NAME }}"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          mv "dist/LightNovelTranslatorV1.6" "$APP_BINARY"
          chmod +x "$APP_BINARY"
          cat > "$APP_DIR/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>LightNovelTranslator</string>
            <key>CFBundleExecutable</key>
            <string>LightNovelTranslator</string>
            <key>CFBundleIdentifier</key>
            <string>com.haixiudenailaos.lightnoveltranslator</string>
            <key>CFBundleName</key>
            <string>LightNovelTranslator</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.6</string>
            <key>CFBundleVersion</key>
            <string>1.6</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP_DIR/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "${APP_DIR}.zip"

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-macOS-Universal
          path: dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-macOS-Universal.app.zip
          retention-days: 30

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
