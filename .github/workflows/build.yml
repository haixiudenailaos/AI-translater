name: Build V1.6 Desktop Artifacts

on:
  push:
    branches: [V1.6]
  pull_request:
    branches: [V1.6]
  workflow_dispatch:

env:
  APP_NAME: LightNovelTranslator
  APP_VERSION: "1.6"
  # Windows release builds consume the checked-in Python 3.10 hash lock.
  PYTHON_VERSION: "3.10"
  PYINSTALLER_VERSION: "6.11.1"

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Compile first-party Python
        run: python -m compileall -q main.py build.py src tests tools

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: python -m pytest -q

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: python -m pytest --cov=src --cov-branch --cov-report=term-missing --cov-report=xml

      # Block regressions in the transactional configuration, project
      # persistence, and image request-boundary modules while legacy typing is
      # migrated incrementally through the non-blocking full-repository report.
      - name: Type check enforced core modules
        if: matrix.python-version == '3.12'
        run: >
          python -m pyright
          --pythonversion 3.12
          --pythonplatform Linux
          src/config/config_manager.py
          src/infrastructure/project_repository.py
          src/core/image_translator.py

      # Existing legacy annotations still produce errors. Keep the report
      # visible on every PR while the blocking scope is expanded incrementally.
      - name: Type check report
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: python -m pyright --pythonversion 3.12 --pythonplatform Linux

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py312
          path: coverage.xml
          if-no-files-found: error
          retention-days: 30

  wheel-smoke:
    name: Wheel installation smoke test
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build and install wheel outside the repository
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv /tmp/ai-translater-wheel-smoke
          /tmp/ai-translater-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ai-translater-wheel-smoke/bin/python -c "import src; import src.bootstrap; print('wheel-import-ok')"

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install desktop dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
          pip install --require-hashes -r requirements-text-win-py310.lock.txt

      - name: Build single Windows executable
        shell: pwsh
        run: pyinstaller translator.spec --clean --noconfirm

      - name: Rename and validate executable
        shell: pwsh
        run: |
          $source = "dist/LightNovelTranslatorV1.6.exe"
          if (-not (Test-Path $source)) {
            throw "PyInstaller did not produce the expected executable: $source"
          }
          $target = "dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-Windows-x64.exe"
          Move-Item -LiteralPath $source -Destination $target -Force
          Write-Host "Built $target ($([math]::Round((Get-Item $target).Length / 1MB, 1)) MB)"

      - name: Smoke test executable
        shell: pwsh
        run: |
          $exe = "dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-Windows-x64.exe"
          $functional = Start-Process -FilePath $exe -ArgumentList "--packaged-smoke-test" -PassThru
          if (-not $functional.WaitForExit(60000)) {
            Stop-Process -Id $functional.Id -Force
            throw "Packaged dependency smoke test timed out"
          }
          if ($functional.ExitCode -ne 0) {
            throw "Packaged dependency smoke test failed with code $($functional.ExitCode)"
          }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($process.HasExited) {
            throw "Executable exited during startup with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      - name: Upload single executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-Windows-x64
          path: dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
          pip install -r requirements.txt

      - name: Build single macOS executable
        run: pyinstaller translator.spec --clean --noconfirm

      - name: Assemble macOS application
        shell: bash
        run: |
          BINARY="dist/LightNovelTranslatorV1.6"
          if [ ! -f "$BINARY" ]; then
            echo "PyInstaller did not produce the expected binary: $BINARY"
            exit 1
          fi

          APP_DIR="dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-macOS.app"
          APP_BINARY="$APP_DIR/Contents/MacOS/${{ env.APP_NAME }}"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          mv "$BINARY" "$APP_BINARY"
          chmod +x "$APP_BINARY"

          cat > "$APP_DIR/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>LightNovelTranslator</string>
            <key>CFBundleExecutable</key>
            <string>LightNovelTranslator</string>
            <key>CFBundleIdentifier</key>
            <string>com.haixiudenailaos.lightnoveltranslator</string>
            <key>CFBundleName</key>
            <string>LightNovelTranslator</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.6</string>
            <key>CFBundleVersion</key>
            <string>1.6</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          plutil -lint "$APP_DIR/Contents/Info.plist"
          test -x "$APP_BINARY"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "${APP_DIR}.zip"

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-macOS
          path: dist/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-macOS.app.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish V1.6 release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/V1.6'
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6
          target_commitish: V1.6
          name: LightNovelTranslator v1.6
          generate_release_notes: true
          files: release-assets/*
