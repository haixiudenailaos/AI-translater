[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-translater"
version = "1.6.0"
description = "轻小说翻译器：EPUB/TXT 文学翻译与图片翻译工具"
# 应用支持 Python 3.10 及以上；质量门禁覆盖多个主流 Python 版本。
requires-python = ">=3.10,!=3.11.*"
dependencies = [
    # PERF §10.2：声明 h2 依赖以匹配 SiliconFlowAPI 的 http2=True 配置，
    # 避免运行时缺少 h2 后静默回退到 HTTP/1.1。
    "httpx[http2]>=0.27.0",
    # P1-5：约束 ebooklib 上限，0.20 存在破坏性变更导致 EPUB 测试失败
    "ebooklib>=0.18,<0.20",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "Pillow>=9.0.0",
    # 在线图片翻译的 SVG 输入需要转换为 PNG；不能只在运行时提示安装。
    "CairoSVG>=2.7.0,<3.0",
    "chardet>=5.0.0",
    # 火山方舟数据面官方 SDK，AI 图片翻译使用其原生 images.generate(image=...)。
    "volcengine-python-sdk[ark]>=5.0.41,<6.0",
    "keyring>=24.0.0",
]

[project.optional-dependencies]
# 开发依赖：lint、format、测试
dev = [
    "build>=1.2.2",
    "pip-tools>=7.4.1",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # Keep the established formatter baseline stable. Ruff 0.15 reformats
    # legacy files differently and must be adopted through a dedicated sweep.
    "ruff>=0.6.0,<0.7.0",
    # P2-6：渐进类型门禁。先对 domain/application 启用严格类型，
    # 再扩展到 infrastructure 与新 UI adapter。
    # Keep CI's enforced type-checker deterministic across Python versions.
    "pyright==1.1.411",
]
[tool.setuptools.packages.find]
# P1-4：修复 wheel 包发现，包含 src 及其所有子包
where = ["."]
include = ["src*"]

# ── Ruff：lint + format ──────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "third_party",
    "build",
    "dist",
    ".venv",
]

[tool.ruff.lint]
# 初始门禁：启用基础规则集，避免一次性修复全部历史代码。
# E/F: pyflakes + pycodestyle 基础
# I: isort（import 顺序）
# UP: pyupgrade（现代化语法）
# B: bugbear（常见 bug 模式）
# SIM: simplify（简化代码）
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # E501: 行过长（由 formatter 处理，且项目中有大量长字符串）
    "E501",
    # B008: 函数调用作为默认参数（Tkinter 常见模式）
    "B008",
    # SIM117: 嵌套 with 合并（有时影响可读性）
    "SIM117",
    # UP035: typing.List 等已弃用（项目仍在过渡期）
    "UP035",
    # UP006: 使用 list/dict 替代 typing.List/Dict（过渡期保留）
    "UP006",
    # B904: raise from（项目中大量未链式异常，逐步修复）
    "B904",
    # UP042: str, Enum → StrEnum（unsafe fix，运行时行为不同，项目依赖字符串枚举）
    "UP042",
    # SIM105: try-except-pass → contextlib.suppress
    # P3-3 将统一收敛异常处理：要求窄化异常类型或记日志，而非机械替换为 suppress
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
# 测试文件允许使用 assert、宽捕获和未使用导入
"tests/**" = ["S101", "B017", "F841"]
# third_party 不检查
"third_party/**" = ["E", "F", "I", "UP", "B", "SIM"]
# translator.py：B023 误报——stream_callback 在单次迭代的循环内同步调用，
# 列表变量（stream_buffer/pending_parts/preview_lines）为闭包内 mutate，不存在延迟绑定问题
"src/core/translator.py" = ["B023"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── pytest ──────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning:ebooklib.*",
    "ignore::PendingDeprecationWarning",
]

# ── Pyright：渐进类型门禁 ────────────────────────────────────────────
# P2-6：先对 domain/application 启用严格类型（业务核心，类型契约最关键），
# infrastructure 和 ui 暂用 basic 模式避免一次性阻塞历史代码。
# 后续按用例拆分热点模块时，新提取的 command/service/adapter 应继承严格模式。
[tool.pyright]
include = ["src/domain", "src/application", "src/infrastructure", "src/ui", "src/core", "src/api", "src/config"]
exclude = [
    "third_party",
    "build",
    "dist",
    "**/__pycache__",
    ".venv",
]
# domain/application 严格模式（覆盖业务核心契约）
strict = ["src/domain", "src/application"]
# 其余目录使用 basic 模式，避免一次性阻塞历史代码
typeCheckingMode = "basic"
# 暂不强制报告这些（历史代码尚未清理）
reportMissingImports = "none"
reportMissingTypeStubs = "none"
# 严格模式下的额外检查（只在 strict 路径生效）
# Basic-mode legacy adapters are progressively typed. Keep the strict profile
# for domain/application while allowing the repository-wide gate to catch
# soundness errors that do not depend on complete third-party annotations.
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"
reportPrivateImportUsage = "none"
